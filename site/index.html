<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#E4E7EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Motores ESP32</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: #E4E7EB;
    --plate: #F5F6F8;
    --ink: #1D2733;
    --muted: #66717E;
    --m1: #2F5BEA;
    --m2: #E9960C;
    --stop: #D7263D;
    --ok: #1E9E5A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--panel);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    gap: 14px;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.35rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .status { display: flex; align-items: center; gap: 8px; font-size: .95rem; color: var(--muted); }
  .led { width: 10px; height: 10px; border-radius: 50%; background: #A9B1BA; }
  .status[data-s="online"] .led { background: var(--ok); box-shadow: 0 0 0 4px rgba(30,158,90,.18); }
  .status[data-s="offline"] .led { background: var(--stop); }

  .sticks { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 0; }
  .stick {
    display: grid; grid-template-rows: 1fr auto 1fr; gap: 8px;
    background: var(--plate); border-radius: 22px; padding: 10px;
    border: 1px solid #D3D8DE;
  }
  .stick h2 { margin: 0; text-align: center; font-size: 1.05rem; font-weight: 600; color: var(--c); }
  .pad {
    border: 0; border-radius: 16px; touch-action: none;
    background: color-mix(in srgb, var(--c) 12%, white);
    color: var(--c); font: inherit; font-size: 1.1rem; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    transition: background .08s, transform .08s;
  }
  .pad svg { width: 38px; height: 38px; }
  .pad.on { background: var(--c); color: white; transform: scale(.98); }
  .pad:focus-visible, .stopbtn:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--plate); border: 1px solid #D3D8DE; border-radius: 14px; padding: 4px; }
  .tabs button { border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: 1rem; padding: 10px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: white; }
  [hidden] { display: none !important; }
  .dpad { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 10px;
    background: var(--plate); border-radius: 22px; padding: 10px; border: 1px solid #D3D8DE; --c: var(--m1); }
  .dpad .up { grid-area: 1 / 2; } .dpad .left { grid-area: 2 / 1; } .dpad .right { grid-area: 2 / 3; } .dpad .down { grid-area: 3 / 2; }
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
  .speed { background: var(--plate); border-radius: 18px; padding: 12px 16px; border: 1px solid #D3D8DE; }
  .speed label { display: flex; justify-content: space-between; font-size: .95rem; color: var(--muted); margin-bottom: 6px; }
  .speed output { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--ink); height: 28px; }
  .stopbtn {
    width: 96px; height: 96px; border-radius: 50%; border: 0;
    background: var(--stop); color: white; font: inherit; font-weight: 800; font-size: 1.15rem;
    box-shadow: 0 6px 0 #9E1527; touch-action: none;
  }
  .stopbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9E1527; }
  .hint { margin: 0; font-size: .85rem; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .pad, .stopbtn { transition: none; } }
</style>
</head>
<body>
  <header>
    <h1>Motores</h1>
    <div class="status" id="status" data-s="wait" role="status"><span class="led"></span><span id="statusTxt">Conectando…</span></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabRover" aria-selected="true">Rover</button>
    <button role="tab" id="tabMotores" aria-selected="false">Motores</button>
  </div>

  <main class="dpad" id="viewRover" aria-label="Direção do rover">
    <button class="pad up" data-a="f" data-b="f" aria-label="Avançar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>Frente</button>
    <button class="pad left" data-a="t" data-b="f" aria-label="Virar à esquerda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Esq.</button>
    <button class="pad right" data-a="f" data-b="t" aria-label="Virar à direita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>Dir.</button>
    <button class="pad down" data-a="t" data-b="t" aria-label="Ré">Ré<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </main>

  <main class="sticks" id="viewMotores" hidden>
    <section class="stick" style="--c: var(--m1)" aria-label="Motor 1">
      <button class="pad" data-m="1" data-d="f" aria-label="Motor 1 para frente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>Frente
      </button>
      <h2>Motor 1</h2>
      <button class="pad" data-m="1" data-d="t" aria-label="Motor 1 para trás">
        Trás<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </section>
    <section class="stick" style="--c: var(--m2)" aria-label="Motor 2">
      <button class="pad" data-m="2" data-d="f" aria-label="Motor 2 para frente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>Frente
      </button>
      <h2>Motor 2</h2>
      <button class="pad" data-m="2" data-d="t" aria-label="Motor 2 para trás">
        Trás<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </section>
  </main>

  <div class="bar">
    <div class="speed">
      <label for="vel">Velocidade <output id="velOut">78%</output></label>
      <input id="vel" type="range" min="60" max="255" value="200">
    </div>
    <button class="stopbtn" id="stop">Parar</button>
  </div>
  <p class="hint" id="hint">Segure a seta para o rover andar. Soltou, ele para.</p>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
  const BASE = "nfw-motores/6a21b1e8";
  const state = { 1: "p", 2: "p" };
  const vel = document.getElementById("vel");
  const velOut = document.getElementById("velOut");
  const statusEl = document.getElementById("status");
  const statusTxt = document.getElementById("statusTxt");

  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
    clientId: "site-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 2000,
  });

  function setStatus(s, txt) { statusEl.dataset.s = s; statusTxt.textContent = txt; }
  client.on("connect", () => {
    setStatus("wait", "Procurando o ESP32…");
    client.subscribe(BASE + "/status");
  });
  client.on("message", (topic, msg) => {
    if (msg.toString() === "online") setStatus("online", "ESP32 conectado");
    else setStatus("offline", "ESP32 desligado ou sem Wi-Fi");
  });
  client.on("offline", () => setStatus("offline", "Sem internet no celular"));

  function send() {
    if (client.connected) client.publish(BASE + "/cmd", `v${vel.value} 1${state[1]} 2${state[2]}`);
  }
  // Enquanto algum motor gira, repete o comando: o ESP32 para sozinho se o sinal cair.
  setInterval(() => { if (state[1] !== "p" || state[2] !== "p") send(); }, 250);

  // Cada botão diz o que quer de cada motor: as setas mandam nos dois, os de "Motores" em um só.
  document.querySelectorAll(".pad").forEach((pad) => {
    const want = pad.dataset.m ? { [pad.dataset.m]: pad.dataset.d } : { 1: pad.dataset.a, 2: pad.dataset.b };
    const isArrow = !pad.dataset.m;
    const press = (e) => {
      e.preventDefault();
      if (e.pointerId !== undefined) pad.setPointerCapture?.(e.pointerId);
      if (isArrow) document.querySelectorAll(".dpad .pad.on").forEach((p) => p.classList.remove("on"));
      Object.assign(state, want); pad.classList.add("on"); send();
      navigator.vibrate?.(15);
    };
    const release = () => {
      if (!pad.classList.contains("on")) return;
      pad.classList.remove("on");
      for (const m in want) if (state[m] === want[m]) state[m] = "p";
      send();
    };
    pad.addEventListener("pointerdown", press);
    ["pointerup", "pointercancel", "lostpointercapture"].forEach((ev) => pad.addEventListener(ev, release));
    pad.addEventListener("contextmenu", (e) => e.preventDefault());
    pad.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) press(e); });
    pad.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(); });
  });

  function stopAll() {
    state[1] = state[2] = "p";
    document.querySelectorAll(".pad.on").forEach((p) => p.classList.remove("on"));
    if (client.connected) client.publish(BASE + "/cmd", "s");
  }
  const views = { Rover: "Segure a seta para o rover andar. Soltou, ele para.", Motores: "Segure o botão para o motor girar. Soltou, ele para. Dá pra usar os dois ao mesmo tempo." };
  for (const name in views) document.getElementById("tab" + name).addEventListener("click", () => {
    stopAll();
    for (const n in views) {
      document.getElementById("view" + n).hidden = n !== name;
      document.getElementById("tab" + n).setAttribute("aria-selected", n === name);
    }
    document.getElementById("hint").textContent = views[name];
  });

  document.getElementById("stop").addEventListener("pointerdown", () => { stopAll(); navigator.vibrate?.([30, 40, 30]); });

  vel.addEventListener("input", () => { velOut.textContent = Math.round(vel.value / 255 * 100) + "%"; });
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopAll(); });
</script>
</body>
</html>
